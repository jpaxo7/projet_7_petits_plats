<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Les Petits Plats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- HEADER  -->
    <header class="hero">
      <div class="hero__content">
        <div class="hero__logo">
          <a href="index.html">
            <img
              src="assets/Logo.png"
              alt="Les petits plats"
              class="hero__logo-img"
            />
          </a>
        </div>
        <h1 class="hero__title">
          Cherchez parmi plus de 1500 recettes du quotidien, simples et
          délicieuses
        </h1>
        <div class="search-bar">
          <input
            type="text"
            class="search-bar__input"
            placeholder="Rechercher une recette, un ingrédient, ..."
            aria-label="Rechercher une recette"
          />
          <button class="search-bar__btn" aria-label="Rechercher">
            <svg
              viewBox="0 0 28 29"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="10" cy="10.4219" r="9.5" stroke="white" />
              <line
                x1="18.3536"
                y1="19.0683"
                x2="27.3536"
                y2="28.0683"
                stroke="white"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="px-4 px-lg-5" style="max-width: 1440px; margin: 0 auto">
      <!-- Filters -->
      <section class="filters d-flex flex-wrap align-items-start gap-3">
        <div class="d-flex flex-wrap gap-3">
          <!-- Ingrédients -->
          <div class="dropdown filter-dropdown">
            <button
              class="filter-dropdown__btn dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Ingrédients
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="dropdown-menu filter-dropdown__menu">
              <input
                type="text"
                class="filter-dropdown__search"
                placeholder="Rechercher un ingrédient"
              />
              <ul class="filter-dropdown__list"></ul>
            </div>
          </div>

          <!-- Appareils -->
          <div class="dropdown filter-dropdown">
            <button
              class="filter-dropdown__btn dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Appareils
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="dropdown-menu filter-dropdown__menu">
              <input
                type="text"
                class="filter-dropdown__search"
                placeholder="Rechercher un appareil"
              />
              <ul class="filter-dropdown__list"></ul>
            </div>
          </div>

          <!-- Ustensiles -->
          <div class="dropdown filter-dropdown">
            <button
              class="filter-dropdown__btn dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Ustensiles
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="dropdown-menu filter-dropdown__menu">
              <input
                type="text"
                class="filter-dropdown__search"
                placeholder="Rechercher un ustensile"
              />
              <ul class="filter-dropdown__list"></ul>
            </div>
          </div>
        </div>

        <div class="ms-auto">
          <span class="recipe-count">50 recettes</span>
        </div>
      </section>

      <!-- Active Tags (exemple visuel) -->
      <section class="active-tags mb-4">
        <!-- Les tags apparaîtront ici dynamiquement -->
      </section>

      <!-- Recipe Cards Grid -->
      <section class="row g-4 pb-5" id="recipes-grid">
        <!-- Les cartes de recettes seront injectées ici dynamiquement -->
      </section>
    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
